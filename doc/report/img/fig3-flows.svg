<rect width="1280" height="880" fill="#ffffff"/>
<text x="60" y="58" font-family="Noto Sans CJK SC" font-size="24" fill="#202124" text-anchor="start" font-weight="bold">四条数据流：同一份用例，四种路径</text><text x="60" y="90" font-family="Noto Sans CJK SC" font-size="14" fill="#5f6368" text-anchor="start" font-weight="normal">★ 标在决定成败的那一跳上，方框下面的小字是服务端最终看到的源地址</text><rect x="40" y="118" width="580" height="348" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.4"/><rect x="40" y="118" width="580" height="8" rx="4" fill="#1f6feb"/><text x="64" y="164" font-family="Noto Sans CJK SC" font-size="17" fill="#1f6feb" text-anchor="start" font-weight="bold">① v4 直达</text><text x="596" y="164" font-family="Noto Sans CJK SC" font-size="12" fill="#5f6368" text-anchor="end" font-weight="normal">场景 1 / 3 / 7 / 8</text><rect x="64" y="188" width="532" height="38" rx="6" fill="#ffffff" stroke="#1f6feb" stroke-width="1.5"/><text x="78" y="212" font-family="Noto Sans CJK SC" font-size="12" fill="#3c4043" text-anchor="start" font-weight="normal">dual_client / ipv4_client</text><line x1="330" y1="226" x2="330" y2="238" stroke="#1f6feb" stroke-width="1.6" marker-end="url(#ah)"/><rect x="64" y="242" width="532" height="38" rx="6" fill="#ffffff" stroke="#1f6feb" stroke-width="1.5"/><text x="78" y="266" font-family="Noto Sans CJK SC" font-size="12" fill="#3c4043" text-anchor="start" font-weight="normal">gateway 192.168.0.1 转发</text><line x1="330" y1="280" x2="330" y2="292" stroke="#1f6feb" stroke-width="1.6" marker-end="url(#ah)"/><rect x="64" y="296" width="532" height="38" rx="6" fill="#ffffff" stroke="#1f6feb" stroke-width="1.5"/><text x="78" y="320" font-family="Noto Sans CJK SC" font-size="12" fill="#3c4043" text-anchor="start" font-weight="normal">★ gateway MASQUERADE → 172.17.0.3</text><line x1="330" y1="334" x2="330" y2="346" stroke="#1f6feb" stroke-width="1.6" marker-end="url(#ah)"/><rect x="64" y="350" width="532" height="38" rx="6" fill="#ffffff" stroke="#1f6feb" stroke-width="1.5"/><text x="78" y="374" font-family="Noto Sans CJK SC" font-size="12" fill="#3c4043" text-anchor="start" font-weight="normal">宿主 SNAT → 公网 v4</text><text x="64" y="434" font-family="Noto Sans CJK SC" font-size="11.5" fill="#5f6368" text-anchor="start" font-weight="normal">服务端看到宿主公网 v4（218.241.114.3）</text><rect x="660" y="118" width="580" height="348" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.4"/><rect x="660" y="118" width="580" height="8" rx="4" fill="#0f9d58"/><text x="684" y="164" font-family="Noto Sans CJK SC" font-size="17" fill="#0f9d58" text-anchor="start" font-weight="bold">② v6 直达</text><text x="1216" y="164" font-family="Noto Sans CJK SC" font-size="12" fill="#5f6368" text-anchor="end" font-weight="normal">场景 2 / 5 / 9 / 10</text><rect x="684" y="188" width="532" height="38" rx="6" fill="#ffffff" stroke="#0f9d58" stroke-width="1.5"/><text x="698" y="212" font-family="Noto Sans CJK SC" font-size="12" fill="#3c4043" text-anchor="start" font-weight="normal">dual_client / strict ::10 / ::60</text><line x1="950" y1="226" x2="950" y2="238" stroke="#0f9d58" stroke-width="1.6" marker-end="url(#ah)"/><rect x="684" y="242" width="532" height="38" rx="6" fill="#ffffff" stroke="#0f9d58" stroke-width="1.5"/><text x="698" y="266" font-family="Noto Sans CJK SC" font-size="12" fill="#3c4043" text-anchor="start" font-weight="normal">gateway 2001:db8:1::1 转发</text><line x1="950" y1="280" x2="950" y2="292" stroke="#0f9d58" stroke-width="1.6" marker-end="url(#ah)"/><rect x="684" y="296" width="532" height="38" rx="6" fill="#ffffff" stroke="#0f9d58" stroke-width="1.5"/><text x="698" y="320" font-family="Noto Sans CJK SC" font-size="12" fill="#3c4043" text-anchor="start" font-weight="normal">★ gateway MASQUERADE → fd00:6b65::x</text><line x1="950" y1="334" x2="950" y2="346" stroke="#0f9d58" stroke-width="1.6" marker-end="url(#ah)"/><rect x="684" y="350" width="532" height="38" rx="6" fill="#ffffff" stroke="#0f9d58" stroke-width="1.5"/><text x="698" y="374" font-family="Noto Sans CJK SC" font-size="12" fill="#3c4043" text-anchor="start" font-weight="normal">宿主 NAT66 → 公网 v6</text><text x="684" y="434" font-family="Noto Sans CJK SC" font-size="11.5" fill="#5f6368" text-anchor="start" font-weight="normal">服务端看到宿主原生 v6（2001:dc7:dd00:6400::40）</text><rect x="40" y="500" width="580" height="348" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.4"/><rect x="40" y="500" width="580" height="8" rx="4" fill="#e8710a"/><text x="64" y="546" font-family="Noto Sans CJK SC" font-size="17" fill="#e8710a" text-anchor="start" font-weight="bold">③ DNS64 + NAT64</text><text x="596" y="546" font-family="Noto Sans CJK SC" font-size="12" fill="#5f6368" text-anchor="end" font-weight="normal">场景 4</text><rect x="64" y="570" width="532" height="38" rx="6" fill="#ffffff" stroke="#e8710a" stroke-width="1.5"/><text x="78" y="594" font-family="Noto Sans CJK SC" font-size="12" fill="#3c4043" text-anchor="start" font-weight="normal">nat64_client ::664 发请求</text><line x1="330" y1="608" x2="330" y2="620" stroke="#e8710a" stroke-width="1.6" marker-end="url(#ah)"/><rect x="64" y="624" width="532" height="38" rx="6" fill="#ffffff" stroke="#e8710a" stroke-width="1.5"/><text x="78" y="648" font-family="Noto Sans CJK SC" font-size="12" fill="#3c4043" text-anchor="start" font-weight="normal">dns 合成 AAAA = 64:ff9b::&lt;v4&gt;</text><line x1="330" y1="662" x2="330" y2="674" stroke="#e8710a" stroke-width="1.6" marker-end="url(#ah)"/><rect x="64" y="678" width="532" height="38" rx="6" fill="#ffffff" stroke="#e8710a" stroke-width="1.5"/><text x="78" y="702" font-family="Noto Sans CJK SC" font-size="12" fill="#3c4043" text-anchor="start" font-weight="normal">★ nat64 翻译：源 → 192.168.0.64</text><line x1="330" y1="716" x2="330" y2="728" stroke="#e8710a" stroke-width="1.6" marker-end="url(#ah)"/><rect x="64" y="732" width="532" height="38" rx="6" fill="#ffffff" stroke="#1f6feb" stroke-width="1.5"/><text x="78" y="756" font-family="Noto Sans CJK SC" font-size="12" fill="#3c4043" text-anchor="start" font-weight="normal">gateway + 宿主两层 NAT → 公网 v4</text><text x="64" y="816" font-family="Noto Sans CJK SC" font-size="11.5" fill="#5f6368" text-anchor="start" font-weight="normal">服务端看到宿主公网 v4（218.241.114.3）</text><rect x="660" y="500" width="580" height="348" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.4"/><rect x="660" y="500" width="580" height="8" rx="4" fill="#7b3fe4"/><text x="684" y="546" font-family="Noto Sans CJK SC" font-size="17" fill="#7b3fe4" text-anchor="start" font-weight="bold">④ SIIT</text><text x="1216" y="546" font-family="Noto Sans CJK SC" font-size="12" fill="#5f6368" text-anchor="end" font-weight="normal">场景 6（IPv6-only-DC）</text><rect x="684" y="570" width="532" height="38" rx="6" fill="#ffffff" stroke="#1f6feb" stroke-width="1.5"/><text x="698" y="594" font-family="Noto Sans CJK SC" font-size="12" fill="#3c4043" text-anchor="start" font-weight="normal">ipv4_client .40 连 192.168.46.1</text><line x1="950" y1="608" x2="950" y2="620" stroke="#1f6feb" stroke-width="1.6" marker-end="url(#ah)"/><rect x="684" y="624" width="532" height="38" rx="6" fill="#ffffff" stroke="#7b3fe4" stroke-width="1.5"/><text x="698" y="648" font-family="Noto Sans CJK SC" font-size="12" fill="#3c4043" text-anchor="start" font-weight="normal">gateway 路由到 siit .46</text><line x1="950" y1="662" x2="950" y2="674" stroke="#7b3fe4" stroke-width="1.6" marker-end="url(#ah)"/><rect x="684" y="678" width="532" height="38" rx="6" fill="#ffffff" stroke="#7b3fe4" stroke-width="1.5"/><text x="698" y="702" font-family="Noto Sans CJK SC" font-size="12" fill="#3c4043" text-anchor="start" font-weight="normal">★ EAMT：源 → 2001:db8:4::40，目的 → 目标真 v6</text><line x1="950" y1="716" x2="950" y2="728" stroke="#7b3fe4" stroke-width="1.6" marker-end="url(#ah)"/><rect x="684" y="732" width="532" height="38" rx="6" fill="#ffffff" stroke="#7b3fe4" stroke-width="1.5"/><text x="698" y="756" font-family="Noto Sans CJK SC" font-size="12" fill="#3c4043" text-anchor="start" font-weight="normal">gateway + 宿主两层 NAT → 公网 v6</text><text x="684" y="816" font-family="Noto Sans CJK SC" font-size="11.5" fill="#5f6368" text-anchor="start" font-weight="normal">服务端看到宿主原生 v6（2001:dc7:dd00:6400::40）</text><text x="60" y="858" font-family="Noto Sans CJK SC" font-size="13" fill="#3c4043" text-anchor="start" font-weight="normal">四条路径最后都要落到 gateway 的 eth1，再到 docker0。lab 内部怎么翻译，源地址都要过 gateway 和宿主两层 NAT 才变公网。</text>
</svg>