<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="830" viewBox="0 0 1320 830">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/></marker></defs>
<rect width="1320" height="830" fill="#ffffff"/>
<text x="60" y="58" font-family="Noto Sans CJK SC" font-size="24" fill="#202124" text-anchor="start" font-weight="bold">拓扑：8 台容器挂在同一条虚拟网线上</text><text x="60" y="90" font-family="Noto Sans CJK SC" font-size="14" fill="#5f6368" text-anchor="start" font-weight="normal">LAB 是一个碰撞域，相当于一根网线。v4 和 v6 是这条线上的两套栈，不是两张网。</text><rect x="440" y="120" width="420" height="76" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1.4"/><text x="650" y="148" font-family="Noto Sans CJK SC" font-size="14" fill="#202124" text-anchor="middle" font-weight="bold">宿主 eno1（公网 v4 + 原生 v6）</text><text x="650" y="174" font-family="Noto Sans CJK SC" font-size="11.5" fill="#5f6368" text-anchor="middle" font-weight="normal">218.241.114.3 / 2001:dc7:dd00:6400::40</text><rect x="440" y="222" width="420" height="64" rx="6" fill="#ffffff" stroke="#0f9d58" stroke-width="1.4"/><text x="650" y="246" font-family="Noto Sans CJK SC" font-size="14" fill="#0f9d58" text-anchor="middle" font-weight="bold">docker0 桥</text><text x="650" y="270" font-family="Noto Sans CJK SC" font-size="11.5" fill="#5f6368" text-anchor="middle" font-weight="normal">172.17.0.1 / fd00:6b65::1（需手动开启）</text><line x1="650" y1="196" x2="650" y2="220" stroke="#9aa0a6" stroke-width="2" marker-end="url(#ah)"/><line x1="438" y1="268" x2="300" y2="306" stroke="#0f9d58" stroke-width="2" marker-end="url(#ah)"/><text x="312" y="262" font-family="Noto Sans CJK SC" font-size="11.5" fill="#0f9d58" text-anchor="start" font-weight="normal">gateway 的 eth1 挂在这座桥上</text><rect x="96" y="306" width="200" height="158" rx="8" fill="#f8fbff" stroke="#1f6feb" stroke-width="2"/><text x="196" y="332" font-family="Noto Sans CJK SC" font-size="16" fill="#1f6feb" text-anchor="middle" font-weight="bold">gateway</text><text x="196" y="354" font-family="Noto Sans CJK SC" font-size="11" fill="#5f6368" text-anchor="middle" font-weight="normal">唯一出口：转发 + 双栈 NAT</text><text x="196" y="380" font-family="Noto Sans CJK SC" font-size="11" fill="#202124" text-anchor="middle" font-weight="normal">eth0 2001:db8:1::1/64</text><text x="196" y="398" font-family="Noto Sans CJK SC" font-size="11" fill="#202124" text-anchor="middle" font-weight="normal">        192.168.0.1/24</text><text x="196" y="430" font-family="Noto Sans CJK SC" font-size="11" fill="#202124" text-anchor="middle" font-weight="normal">eth1 172.17.0.3</text><text x="196" y="448" font-family="Noto Sans CJK SC" font-size="11" fill="#202124" text-anchor="middle" font-weight="normal">（挂 docker0）</text><line x1="100" y1="492" x2="1222" y2="492" stroke="#202124" stroke-width="3"/><text x="1230" y="498" font-family="Noto Sans CJK SC" font-size="13" fill="#202124" text-anchor="start" font-weight="bold">LAB</text><line x1="196" y1="464" x2="196" y2="492" stroke="#1f6feb" stroke-width="2"/><rect x="350" y="372" width="210" height="108" rx="8" fill="#ffffff" stroke="#e8710a" stroke-width="1.8"/><text x="455" y="398" font-family="Noto Sans CJK SC" font-size="15" fill="#e8710a" text-anchor="middle" font-weight="bold">dns</text><text x="455" y="420" font-family="Noto Sans CJK SC" font-size="11" fill="#3c4043" text-anchor="middle" font-weight="normal">2001:db8:1::53</text><text x="455" y="438" font-family="Noto Sans CJK SC" font-size="11" fill="#3c4043" text-anchor="middle" font-weight="normal">192.168.0.53</text><text x="455" y="458" font-family="Noto Sans CJK SC" font-size="10.5" fill="#5f6368" text-anchor="middle" font-weight="normal">BIND9 权威区</text><text x="455" y="474" font-family="Noto Sans CJK SC" font-size="10.5" fill="#5f6368" text-anchor="middle" font-weight="normal">DNS64 64:ff9b::/96</text><line x1="455" y1="480" x2="455" y2="492" stroke="#e8710a" stroke-width="2"/><rect x="580" y="372" width="210" height="108" rx="8" fill="#ffffff" stroke="#e8710a" stroke-width="1.8"/><text x="685" y="398" font-family="Noto Sans CJK SC" font-size="15" fill="#e8710a" text-anchor="middle" font-weight="bold">nat64</text><text x="685" y="420" font-family="Noto Sans CJK SC" font-size="11" fill="#3c4043" text-anchor="middle" font-weight="normal">2001:db8:1::64</text><text x="685" y="438" font-family="Noto Sans CJK SC" font-size="11" fill="#3c4043" text-anchor="middle" font-weight="normal">192.168.0.64</text><text x="685" y="458" font-family="Noto Sans CJK SC" font-size="10.5" fill="#5f6368" text-anchor="middle" font-weight="normal">Jool 有状态</text><text x="685" y="474" font-family="Noto Sans CJK SC" font-size="10.5" fill="#5f6368" text-anchor="middle" font-weight="normal">pool6 64:ff9b::/96</text><line x1="685" y1="480" x2="685" y2="492" stroke="#e8710a" stroke-width="2"/><rect x="810" y="372" width="210" height="108" rx="8" fill="#ffffff" stroke="#7b3fe4" stroke-width="1.8"/><text x="915" y="398" font-family="Noto Sans CJK SC" font-size="15" fill="#7b3fe4" text-anchor="middle" font-weight="bold">siit</text><text x="915" y="420" font-family="Noto Sans CJK SC" font-size="11" fill="#3c4043" text-anchor="middle" font-weight="normal">2001:db8:1::46</text><text x="915" y="438" font-family="Noto Sans CJK SC" font-size="11" fill="#3c4043" text-anchor="middle" font-weight="normal">192.168.0.46</text><text x="915" y="458" font-family="Noto Sans CJK SC" font-size="10.5" fill="#5f6368" text-anchor="middle" font-weight="normal">Jool 无状态</text><text x="915" y="474" font-family="Noto Sans CJK SC" font-size="10.5" fill="#5f6368" text-anchor="middle" font-weight="normal">2 条 EAMT 映射</text><line x1="915" y1="480" x2="915" y2="492" stroke="#7b3fe4" stroke-width="2"/><rect x="350" y="560" width="190" height="100" rx="8" fill="#ffffff" stroke="#0f9d58" stroke-width="1.8"/><text x="445" y="586" font-family="Noto Sans CJK SC" font-size="13.5" fill="#0f9d58" text-anchor="middle" font-weight="bold">dual_client</text><text x="445" y="610" font-family="Noto Sans CJK SC" font-size="11" fill="#3c4043" text-anchor="middle" font-weight="normal">2001:db8:1::10</text><text x="445" y="628" font-family="Noto Sans CJK SC" font-size="11" fill="#3c4043" text-anchor="middle" font-weight="normal">192.168.0.10</text><text x="445" y="650" font-family="Noto Sans CJK SC" font-size="10.5" fill="#5f6368" text-anchor="middle" font-weight="normal">双栈探针 · 3 个域名</text><line x1="445" y1="560" x2="445" y2="492" stroke="#0f9d58" stroke-width="2" stroke-dasharray="6 4"/><rect x="580" y="560" width="190" height="100" rx="8" fill="#ffffff" stroke="#1f6feb" stroke-width="1.8"/><text x="675" y="586" font-family="Noto Sans CJK SC" font-size="13.5" fill="#1f6feb" text-anchor="middle" font-weight="bold">ipv4_client</text><text x="675" y="610" font-family="Noto Sans CJK SC" font-size="11" fill="#3c4043" text-anchor="middle" font-weight="normal">（无 v6 地址）</text><text x="675" y="628" font-family="Noto Sans CJK SC" font-size="11" fill="#3c4043" text-anchor="middle" font-weight="normal">192.168.0.40</text><text x="675" y="650" font-family="Noto Sans CJK SC" font-size="10.5" fill="#5f6368" text-anchor="middle" font-weight="normal">纯 v4 探针 · 3 个域名</text><line x1="675" y1="560" x2="675" y2="492" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6 4"/><rect x="810" y="560" width="190" height="100" rx="8" fill="#ffffff" stroke="#0f9d58" stroke-width="1.8"/><text x="905" y="586" font-family="Noto Sans CJK SC" font-size="13.5" fill="#0f9d58" text-anchor="middle" font-weight="bold">ipv6_strict_client</text><text x="905" y="610" font-family="Noto Sans CJK SC" font-size="11" fill="#3c4043" text-anchor="middle" font-weight="normal">2001:db8:1::60</text><text x="905" y="628" font-family="Noto Sans CJK SC" font-size="11" fill="#3c4043" text-anchor="middle" font-weight="normal">（无 v4 地址）</text><text x="905" y="650" font-family="Noto Sans CJK SC" font-size="10.5" fill="#5f6368" text-anchor="middle" font-weight="normal">纯 v6 · 封死 64:ff9b::/96</text><line x1="905" y1="560" x2="905" y2="492" stroke="#0f9d58" stroke-width="2" stroke-dasharray="6 4"/><rect x="1040" y="560" width="190" height="100" rx="8" fill="#ffffff" stroke="#e8710a" stroke-width="1.8"/><text x="1135" y="586" font-family="Noto Sans CJK SC" font-size="13.5" fill="#e8710a" text-anchor="middle" font-weight="bold">ipv6_nat64_client</text><text x="1135" y="610" font-family="Noto Sans CJK SC" font-size="11" fill="#3c4043" text-anchor="middle" font-weight="normal">2001:db8:1::664</text><text x="1135" y="628" font-family="Noto Sans CJK SC" font-size="11" fill="#3c4043" text-anchor="middle" font-weight="normal">（无 v4 地址）</text><text x="1135" y="650" font-family="Noto Sans CJK SC" font-size="10.5" fill="#5f6368" text-anchor="middle" font-weight="normal">纯 v6 · 2 个域名</text><line x1="1135" y1="560" x2="1135" y2="492" stroke="#e8710a" stroke-width="2" stroke-dasharray="6 4"/><text x="60" y="712" font-family="Noto Sans CJK SC" font-size="13" fill="#3c4043" text-anchor="start" font-weight="normal">地址规律：v6 的 host 段就是 v4 的最后一段（::53/.53、::64/.64、::46/.46），只有两台纯 v6 探针例外</text><text x="60" y="738" font-family="Noto Sans CJK SC" font-size="13" fill="#3c4043" text-anchor="start" font-weight="normal">两组幻影地址不在网线上：64:ff9b::/96 是 NAT64 池；2001:db8:4::/120 与 192.168.46.0/24 是 SIIT 的映射</text><text x="60" y="782" font-family="Noto Sans CJK SC" font-size="13" fill="#7b3fe4" text-anchor="start" font-weight="normal">本机实测：宿主只有单个 /128、没有可下发的 /64，容器出公网 v6 只能靠 fd00 ULA + 宿主 NAT66 两层翻译</text>
</svg>