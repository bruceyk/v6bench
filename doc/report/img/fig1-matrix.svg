<text x="60" y="58" font-family="Noto Sans CJK SC" font-size="24" fill="#202124" text-anchor="start" font-weight="bold">同一套接口用例，四种 DNS 回答，四种客户端能力</text><text x="60" y="90" font-family="Noto Sans CJK SC" font-size="14" fill="#5f6368" text-anchor="start" font-weight="normal">矩阵里每一组是一次运行，十组组合对应 draft-ietf-v6ops-ipv6-app-testing 表 1 的十个测试场景</text><rect x="268" y="104" width="220" height="66" rx="6" fill="#ffffff" stroke="#0f9d58" stroke-width="1.4"/><text x="280" y="130" font-family="Noto Sans CJK SC" font-size="14" fill="#0f9d58" text-anchor="start" font-weight="bold">dual.lab.api.apis.guru</text><text x="280" y="154" font-family="Noto Sans CJK SC" font-size="12" fill="#5f6368" text-anchor="start" font-weight="normal">真实 A + 真实 AAAA</text><rect x="504" y="104" width="220" height="66" rx="6" fill="#ffffff" stroke="#1f6feb" stroke-width="1.4"/><text x="516" y="130" font-family="Noto Sans CJK SC" font-size="14" fill="#1f6feb" text-anchor="start" font-weight="bold">ipv4.lab.api.apis.guru</text><text x="516" y="154" font-family="Noto Sans CJK SC" font-size="12" fill="#5f6368" text-anchor="start" font-weight="normal">只有真实 A</text><rect x="740" y="104" width="220" height="66" rx="6" fill="#ffffff" stroke="#0f9d58" stroke-width="1.4"/><text x="752" y="130" font-family="Noto Sans CJK SC" font-size="14" fill="#0f9d58" text-anchor="start" font-weight="bold">ipv6.lab.api.apis.guru</text><text x="752" y="154" font-family="Noto Sans CJK SC" font-size="12" fill="#5f6368" text-anchor="start" font-weight="normal">只有真实 AAAA</text><rect x="976" y="104" width="220" height="66" rx="6" fill="#ffffff" stroke="#7b3fe4" stroke-width="1.4"/><text x="988" y="130" font-family="Noto Sans CJK SC" font-size="14" fill="#7b3fe4" text-anchor="start" font-weight="bold">siit.lab.api.apis.guru</text><text x="988" y="154" font-family="Noto Sans CJK SC" font-size="12" fill="#5f6368" text-anchor="start" font-weight="normal">只有 A 192.168.46.1</text><rect x="60" y="160" width="186" height="94" rx="6" fill="#ff